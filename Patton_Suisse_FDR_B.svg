<text x="540" y="67" text-anchor="middle" class="t title" style="font-size:37px">PATTON SUISSE – FEUILLE DE ROUTE</text>
<text x="540" y="111" text-anchor="middle" class="t subtitle">Magic Contest + Bridgemates</text>
<g transform="translate(936,27)"><rect width="86" height="94" rx="12" fill="#dbe2e6" stroke="#a4b0b8" stroke-width="5"/><rect x="18" y="13" width="50" height="21" rx="3" fill="#91b86b"/><g fill="#60707d"><rect x="18" y="44" width="12" height="10" rx="2"/><rect x="37" y="44" width="12" height="10" rx="2"/><rect x="56" y="44" width="12" height="10" rx="2"/><rect x="18" y="60" width="12" height="10" rx="2"/><rect x="37" y="60" width="12" height="10" rx="2"/><rect x="56" y="60" width="12" height="10" rx="2"/><rect x="18" y="76" width="12" height="10" rx="2"/><rect x="37" y="76" width="12" height="10" rx="2"/><rect x="56" y="76" width="12" height="10" rx="2"/></g></g>
