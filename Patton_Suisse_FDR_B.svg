<text x="97" y="205" class="t sect" fill="#123e65">AVANT LA COMPÉTITION</text>
<g class="t body">
<g fill="#0d548a"><circle cx="52" cy="252" r="13"/><circle cx="52" cy="294" r="13"/><circle cx="52" cy="336" r="13"/><circle cx="52" cy="378" r="13"/></g>
<g fill="white" font-size="18" font-weight="900"><text x="52" y="259" text-anchor="middle">✓</text><text x="52" y="301" text-anchor="middle">✓</text><text x="52" y="343" text-anchor="middle">✓</text><text x="52" y="385" text-anchor="middle">✓</text></g>
<text x="83" y="260">Importer dans <tspan font-weight="800">docs/Magic import</tspan></text>
<text x="83" y="302">Vérifier : <tspan font-weight="800">18 équipes / 6 tours</tspan></text>
<text x="83" y="344">Activer : <tspan font-weight="800">Utiliser BM</tspan></text>
<text x="83" y="386" font-weight="800">Configurer les Bridgemates</text>
</g>
<rect x="30" y="412" width="488" height="146" rx="14" fill="#fff2d3"/>
<text x="77" y="447" class="t sub">À imprimer</text>
<g class="t small"><circle cx="72" cy="476" r="6" fill="#e9a10b"/><text x="91" y="483">Liste des participants par équipe</text><circle cx="72" cy="507" r="6" fill="#e9a10b"/><text x="91" y="514">Barème PV</text><circle cx="72" cy="538" r="6" fill="#e9a10b"/><text x="91" y="545">Ordre des rencontres T1 et T2</text></g>
<rect x="30" y="571" width="488" height="73" rx="13" fill="#dcefff"/>
<text x="48" y="596" class="t small" font-weight="800">Rappels :</text>
<text x="48" y="621" class="t small">Reçoit = NS en ouvert • A = ouverte • B = fermée</text>
<g filter="url(#shadow)"><rect x="546" y="154" width="520" height="505" rx="15" fill="#eefbf1" stroke="#49b35d" stroke-width="3"/></g>
<circle cx="588" cy="194" r="29" fill="#2f8f3e"/><text x="588" y="205" text-anchor="middle" class="t n">2</text>
<text x="628" y="205" class="t sect" fill="#1f6d2c">INSTALLATION DE LA SALLE</text>
<g class="t body">
<g fill="#2f8f3e"><circle cx="588" cy="254" r="14"/><circle cx="588" cy="306" r="14"/><circle cx="588" cy="358" r="14"/><circle cx="588" cy="410" r="14"/><circle cx="588" cy="462" r="14"/><circle cx="588" cy="514" r="14"/><circle cx="588" cy="566" r="14"/></g>
<g fill="white" font-size="18" font-weight="900"><text x="588" y="261" text-anchor="middle">✓</text><text x="588" y="313" text-anchor="middle">✓</text><text x="588" y="365" text-anchor="middle">✓</text><text x="588" y="417" text-anchor="middle">✓</text><text x="588" y="469" text-anchor="middle">✓</text><text x="588" y="521" text-anchor="middle">✓</text><text x="588" y="573" text-anchor="middle">✓</text></g>
<text x="622" y="262">Matérialiser les tables avec leur numéro</text>
<text x="622" y="314">Mettre éventuellement les paravents</text>
<text x="622" y="366">4 étuis par table</text>
<text x="622" y="418">Prévoir <tspan font-weight="800">9 séries de 8 donnes</tspan></text>
<text x="622" y="470">Installer les BM</text>
<text x="622" y="522">Transférer les étuis</text>
<text x="622" y="574">Surveiller les retardataires</text>
</g>
<g filter="url(#shadow)"><rect x="14" y="674" width="520" height="595" rx="15" fill="#fff0f2" stroke="#ef5a65" stroke-width="3"/></g>
<circle cx="56" cy="714" r="29" fill="#df2237"/><text x="56" y="725" text-anchor="middle" class="t n">3</text>
<text x="97" y="725" class="t sect" fill="#bf2433">DÉMARRAGE</text>
<g class="t small">
<g fill="#df2237"><circle cx="50" cy="764" r="13"/><circle cx="50" cy="811" r="13"/><circle cx="50" cy="876" r="13"/><circle cx="50" cy="923" r="13"/><circle cx="50" cy="988" r="13"/><circle cx="50" cy="1035" r="13"/><circle cx="50" cy="1082" r="13"/><circle cx="50" cy="1129" r="13"/></g>
<g fill="white" font-size="17" font-weight="900"><text x="50" y="770" text-anchor="middle">1</text><text x="50" y="817" text-anchor="middle">2</text><text x="50" y="882" text-anchor="middle">3</text><text x="50" y="929" text-anchor="middle">4</text><text x="50" y="994" text-anchor="middle">5</text><text x="50" y="1041" text-anchor="middle">6</text><text x="50" y="1088" text-anchor="middle">7</text><text x="50" y="1135" text-anchor="middle">8</text></g>
<text x="78" y="771">Ouvrir le Patton Suisse</text>
<text x="78" y="807">Tableau des scores &gt; Menu de l’épreuve &gt;</text><text x="78" y="834" font-weight="800">BM &gt; Créer les données</text>
<text x="78" y="883">Ouvrir <tspan font-weight="800">Saisir le line-up</tspan></text>
<text x="78" y="918">Demander aux joueurs de rentrer leurs</text><text x="78" y="945">numéros de licence</text>
<text x="78" y="995">Cliquer sur <tspan font-weight="800">IMPORTER</tspan></text>
<text x="78" y="1042">Laisser ouvert jusqu’à avoir tout le monde</text>
<text x="78" y="1089">Les <tspan fill="#df2237" font-weight="900">X</tspan> indiquent des erreurs</text>
<text x="78" y="1125">Quand tout est bon : fermer LU puis cliquer</text><text x="78" y="1152">sur BM pour récupérer les scores en boucle</text>
</g>
<rect x="30" y="1171" width="488" height="69" rx="12" fill="#ffb2b6"/>
<text x="274" y="1199" text-anchor="middle" class="t sub" fill="#b91527">NE PAS COMMENCER À JOUER</text>
<text x="274" y="1227" text-anchor="middle" class="t small" font-weight="800">tant que tous les line-up ne sont pas validés.</text>
<text x="42" y="1257" class="t" font-size="18"><tspan font-weight="800">Vérifier aussi :</tspan> orientation des équipes + aucun line-up incomplet.</text>
<g filter="url(#shadow)"><rect x="546" y="674" width="520" height="595" rx="15" fill="#fff9eb" stroke="#ef8a18" stroke-width="3"/></g>
<circle cx="588" cy="714" r="29" fill="#e66d00"/><text x="588" y="725" text-anchor="middle" class="t n">4</text>
<text x="628" y="725" class="t sect" fill="#c65500">À CHAQUE TOUR</text>
<rect x="562" y="747" width="488" height="54" rx="11" fill="#ffe7b9"/><text x="585" y="782" class="t sub" fill="#c65500">Avant le tour</text>
<g class="t" font-size="21">
<text x="586" y="823">✓  Vérifier le tour sélectionné</text>
<text x="586" y="855">✓  Vérifier la mi-temps</text>
<text x="586" y="887">✓  Créer les données BM</text>
<text x="586" y="919">✓  1re donne = 1</text>
<text x="586" y="951">✓  Si BCS est encore ouvert, le fermer avant</text>
<text x="608" y="978">de recréer les données BM</text>
</g>
<rect x="562" y="992" width="488" height="62" rx="11" fill="#dcefff"/>
<text x="585" y="1017" class="t" font-size="18" font-weight="800">Pourquoi ?</text>
<text x="682" y="1017" class="t" font-size="18">Sinon les BM risquent d’enregistrer</text>
<text x="585" y="1042" class="t" font-size="18">dans le tour précédent.</text>
<rect x="562" y="1066" width="488" height="120" rx="13" fill="#e9e2ff"/>
<text x="586" y="1096" class="t" font-size="24" font-weight="800" fill="#473099">Cas particulier : T2</text>
<g class="t" font-size="18">
<text x="600" y="1124">• Bon tour + bonne mi-temps (colonne &gt;1&lt;)</text>
<text x="600" y="1152">• Remettre donne 1 si nécessaire</text>
<text x="600" y="1180">• Puis créer les données BM</text>
</g>
<rect x="562" y="1198" width="488" height="42" rx="11" fill="#ffe7b9"/><text x="585" y="1227" class="t" font-size="23" font-weight="800" fill="#c65500">Pendant le tour</text>
<g class="t" font-size="17">
<text x="586" y="1253">✓  Retardataires • scores • transfert des étuis si besoin</text>
</g>
<g filter="url(#shadow)"><rect x="14" y="1284" width="520" height="280" rx="15" fill="#f2efff" stroke="#8565d8" stroke-width="3"/></g>
<circle cx="56" cy="1324" r="29" fill="#5440a9"/><text x="56" y="1335" text-anchor="middle" class="t n">5</text>
<text x="97" y="1335" class="t sect" fill="#3c2e8a">FIN DE CHAQUE TOUR</text>
<g class="t" font-size="18">
<text x="48" y="1375">✓  Créer les exports</text>
<text x="48" y="1406">✓  Cocher : <tspan font-weight="800">BASE + Envoi résultats base FFB</tspan></text>
<text x="48" y="1437">✓  Faire la sauvegarde Magic (.mcb)</text>
<text x="48" y="1468">✓  Imprimer : Classement + résultat des matchs</text>
<text x="48" y="1499">✓  Imprimer : Résultats finals avec tous les résultats</text>
<text x="48" y="1530">✓  À partir du T3 : avec bonus • Imprimer prochain tour</text>
</g>
<rect x="30" y="1538" width="488" height="18" rx="8" fill="#dcefff"/>
<text x="274" y="1553" text-anchor="middle" class="t" font-size="13" font-weight="800">Après T2 : Ajouter le tour suivant &gt; OK</text>
<g filter="url(#shadow)"><rect x="546" y="1284" width="520" height="280" rx="15" fill="#e9fbfb" stroke="#36a9a9" stroke-width="3"/></g>
