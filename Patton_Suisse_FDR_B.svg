<text x="91" y="1691">18 équipes / 6 tours vérifiés</text><text x="91" y="1730">Utiliser BM activé + BM configurés</text><text x="91" y="1769">4 documents imprimés</text><text x="91" y="1808">Tables numérotées</text><text x="91" y="1847">9 séries de 8 donnes prêtes</text><text x="91" y="1886">Bridgemates installés</text>
<text x="604" y="1691">Tous les line-up validés avant de jouer</text><text x="604" y="1730">1re donne = 1</text><text x="604" y="1769">BCS fermé s’il est encore ouvert</text><text x="604" y="1808">T2 : tour + mi-temps + donne 1 vérifiés</text><text x="604" y="1847">Exports + BASE + FFB + sauvegarde</text><text x="604" y="1886">Résultats + prochain tour imprimés</text>
</g>
