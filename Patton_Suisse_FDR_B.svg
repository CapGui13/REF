    .t{font-family:Arial,Helvetica,sans-serif;fill:#17212b}.h{font-family:Arial,Helvetica,sans-serif;font-weight:800}.small{font-size:22px}.body{font-size:25px}.sub{font-size:28px;font-weight:800}.title{font-size:47px;font-weight:900;fill:white}.subtitle{font-size:31px;font-weight:700;fill:#d7ebff}.sect{font-size:32px;font-weight:900}.n{font-size:30px;font-weight:900;fill:white}.check{font-size:25px}.muted{fill:#53616e}.white{fill:white}
