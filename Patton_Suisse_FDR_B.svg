<text x="678" y="1394" text-anchor="middle" class="t sub" fill="#165c7c">MATIN</text><text x="930" y="1394" text-anchor="middle" class="t sub" fill="#276b39">APRÈS-MIDI</text>
<g class="t small"><text x="594" y="1431">• 10 h 00</text><text x="594" y="1462">• 11 h 15</text><text x="594" y="1493">• 12 h 30</text><text x="838" y="1431">• 14 h 30</text><text x="838" y="1462">• 15 h 45</text><text x="838" y="1493">• 17 h 00</text></g>
<text x="678" y="1539" text-anchor="middle" class="t small" font-weight="800">Fin : 13 h 30</text><text x="930" y="1539" text-anchor="middle" class="t small" font-weight="800">Fin : 18 h 00</text>
<text x="806" y="1558" text-anchor="middle" class="t" font-size="18" fill="#366">Durée / tour : 1 h 05</text>
<g filter="url(#shadow)"><rect x="14" y="1580" width="1052" height="326" rx="15" fill="#fff0f3" stroke="#f05d77" stroke-width="3"/></g>
<circle cx="56" cy="1620" r="29" fill="#c92343"/><text x="56" y="1631" text-anchor="middle" class="t n">7</text>
<text x="97" y="1631" class="t sect" fill="#a91b36">CHECKLIST EXPRESS</text>
