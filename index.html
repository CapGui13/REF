<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141414">
<title>REF — Fiches d'arbitrage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#1a4d2e;--felt-lt:#2e7d4f;--gold:#c8973a;
  --cream:#faf6ef;--card:#fffdf8;--bd:#e8dfc8;
  --txt:#1a1410;--txt2:#6b5d4e;--txt3:#b0a090;
  --shadow:0 2px 8px rgba(0,0,0,.13),0 1px 2px rgba(0,0,0,.07);
  --r:11px;
}
@media(prefers-color-scheme:dark){
  :root{--cream:#0d1a10;--card:#14200f;--bd:#253820;--txt:#f0ebe0;--txt2:#8aaa88;--txt3:#4a6048;--shadow:0 2px 10px rgba(0,0,0,.5)}
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--cream)}
body{
  font-family:'Source Serif 4',Georgia,serif;background:var(--cream);color:var(--txt);
  min-height:100vh;max-width:520px;margin:0 auto;
}
button{font:inherit}
header{
  background:#141414;padding:max(env(safe-area-inset-top,0px),12px) 18px 12px;
  display:flex;align-items:center;justify-content:space-between;position:fixed;
  top:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:200;
  border-bottom:1px solid rgba(200,151,58,.28);min-height:60px;
}
.logo-text{position:absolute;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
.logo-text h1{font-family:'Exo 2',sans-serif;font-size:16px;font-weight:800;color:#fff;letter-spacing:.4px}
.logo-text p{font-size:10px;color:rgba(255,255,255,.36);margin-top:1px;letter-spacing:.5px}
.hd-suits{display:flex;gap:4px;margin-left:auto}
.hd-suits span{font-size:16px}.s{color:#6b9fd4}.h{color:#d4706a}.d{color:#c8924a}.c{color:#6aaa78}

#list-view{padding-top:60px}
.hero{
  background:#202020;color:#fff;padding:20px 18px 17px;border-bottom:1px solid rgba(200,151,58,.15)
}
.hero-title{font-family:'Exo 2',sans-serif;font-size:19px;font-weight:800}
.hero-sub{font-size:12px;color:rgba(255,255,255,.45);margin-top:4px}
.count{color:var(--gold);font-weight:700}

.file-list{padding:16px 18px 28px;display:flex;flex-direction:column;gap:9px}
.file-item{
  background:var(--card);border:1px solid var(--bd);border-radius:var(--r);
  padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .12s,filter .12s;
}
.file-item:active{transform:scale(.98);filter:brightness(.96)}
.file-icon{
  width:42px;height:42px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--felt),var(--felt-lt));
  display:flex;align-items:center;justify-content:center;font-size:20px
}
.file-text{min-width:0;flex:1}
.file-name{
  font-weight:700;font-size:14px;font-family:'Exo 2',sans-serif;
  line-height:1.2;overflow:hidden;text-overflow:ellipsis
}
.file-law{font-size:11px;color:var(--txt2);margin-top:3px}
.chev{color:var(--gold);font-size:21px;flex-shrink:0}
.loading,.error{padding:32px 18px;text-align:center;color:var(--txt2);font-size:13px}
.error{color:#c85a52}


/* ── LIGHTBOX QPJB ── */
.lightbox{
  display:flex;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.95);
  flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  opacity:0;pointer-events:none;transition:opacity .5s ease;
  will-change:opacity;-webkit-transform:translateZ(0);transform:translateZ(0)
}
.lightbox.open{opacity:1;pointer-events:all}
.lightbox-track{display:flex;align-items:center;justify-content:center;width:100%;height:calc(100vh - 80px);position:relative}
.lightbox-img{
  position:absolute;max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;
  box-shadow:0 8px 40px rgba(0,0,0,.7);
  transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s;will-change:transform
}
.lightbox-close{
  position:absolute;top:max(env(safe-area-inset-top,0px),14px);right:18px;
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);
  border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:opacity .15s;z-index:3
}
.lightbox-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.15);border:none;color:#fff;font-size:32px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .15s,opacity .15s;z-index:2
}
.lightbox-nav:hover{background:rgba(255,255,255,.28)}
.lightbox-prev{left:16px}.lightbox-next{right:16px}
.lightbox-name{
  position:absolute;bottom:max(env(safe-area-inset-bottom,0px),14px);left:0;right:0;
  text-align:center;font-size:12px;color:rgba(255,255,255,.45);padding:0 24px
}

</style>
</head>
<body>

<header>
  <div style="width:54px"></div>
  <div class="logo-text">
    <h1>REF</h1>
    <p>Fiches d'arbitrage</p>
  </div>
  <div class="hd-suits"><span class="s">♠</span><span class="h">♥</span><span class="d">♦</span><span class="c">♣</span></div>
</header>

<main id="list-view">
  <section class="hero">
    <div class="hero-title">Références d'arbitrage</div>
    <div class="hero-sub"><span class="count" id="count">…</span> fiches disponibles</div>
  </section>
  <div id="list" class="file-list"><div class="loading">Chargement des fiches…</div></div>
</main>


<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" onclick="event.stopPropagation();navLightbox(-1)">‹</button>
  <div class="lightbox-track" id="lightbox-track" onclick="if(event.target===this)closeLightbox()">
    <img class="lightbox-img" id="lightbox-img-a" src="" alt="">
    <img class="lightbox-img" id="lightbox-img-b" src="" alt="" style="opacity:0;pointer-events:none">
  </div>
  <button class="lightbox-nav lightbox-next" id="lightbox-next" onclick="event.stopPropagation();navLightbox(1)">›</button>
  <div class="lightbox-name" id="lightbox-name"></div>
</div>

<script>
const OWNER='CapGui13';
const REPO='REF';
const FALLBACK=[
'00_Patton_Suisse_Feuille_de_route.svg',
'Patton_Suisse_FDR_B.svg',
'01_Passe_hors_tour_Loi_30.png',
'02_Enchere_hors_tour_Loi_31.png',
'03_X_XX_hors_tour_Loi_32.png',
'04_Enchere_insuffisante_Loi_27.png',
'05_Renonce_Lois_62_63.png',
'06_Renonce_consommee_Loi_64.png',
'07_Cartes_penalisees_Lois_49_50.png',
'08_Cartes_penalisees_Lois_50_51.png',
'09_Entame_hors_tour_Lois_53_54.png',
'10_Changement_de_declaration_Loi_25.png',
'Arbitrage avec écrans.png',
'Attaque et jeu prématuré (loi 57).png',
'Carte exposée pendant les annonces (loi 24).png',
'Cartes simultanées (loi 58).png',
'Déclaration comparable (loi 23).png',
"Déclaration retirée, pénalités d'attaque (loi 26).png",
'Entame HT avec écran.png',
"Erreur d'application ou d'explication (lois 40 & 75).png"
];

let files=[];
let current=0;

function rawUrl(name){
  return 'https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/main/'+encodeURIComponent(name).replace(/%2F/g,'/');
}
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});
}
function naturalSort(a,b){
  const priority=function(name){
    if(name==='00_Patton_Suisse_Feuille_de_route.svg') return 0;
    if(name==='Patton_Suisse_FDR_B.svg') return 1;
    const m=name.match(/^\d+/);
    return m ? 100+parseInt(m[0],10) : 999;
  };
  const pa=priority(a), pb=priority(b);
  if(pa!==pb)return pa-pb;
  return a.localeCompare(b,'fr',{numeric:true,sensitivity:'base'});
}
function cleanName(name){
  if(name==='Patton_Suisse_FDR_B.svg') return 'Patton Suisse FDR B';
  let s=name.replace(/\.(png|svg)$/i,'').replace(/^\d+[_ -]*/,'').replace(/_/g,' ');
  s=s.replace(/\s+/g,' ').trim();
  return s;
}
function splitLabel(name){
  const title=cleanName(name);
  const m=title.match(/^(.*?)(?:\s*[-–—,]?\s*)(\(?lois?\s+[\d &]+\)?)$/i);
  if(m)return {title:m[1].trim(),law:m[2].replace(/^\(/,'').replace(/\)$/,'')};
  return {title:title,law:''};
}
function renderList(){
  document.getElementById('count').textContent=files.length;
  const list=document.getElementById('list');
  list.innerHTML=files.map(function(f,i){
    const x=splitLabel(f.name);
    return '<div class="file-item" onclick="openLightbox('+i+')">'+
      '<div class="file-icon">🔍</div>'+
      '<div class="file-text"><div class="file-name">'+esc(x.title)+'</div>'+
      (x.law?'<div class="file-law">'+esc(x.law)+'</div>':'')+
      '</div><div class="chev">›</div></div>';
  }).join('');
}
async function loadFiles(){
  try{
    const r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/');
    if(!r.ok)throw new Error('GitHub '+r.status);
    const data=await r.json();
    files=data.filter(function(f){
      return f.type==='file' && /\.(png|svg)$/i.test(f.name);
    }).map(function(f){
      return {name:f.name,url:f.download_url||rawUrl(f.name)};
    }).sort(function(a,b){return naturalSort(a.name,b.name)});
    if(!files.length)throw new Error('Aucune image');
  }catch(e){
    files=FALLBACK.map(function(name){return {name:name,url:rawUrl(name)}});
  }
  renderList();
}
let lightboxIdx=0;
function imgA(){return document.getElementById('lightbox-img-a')}
function imgB(){return document.getElementById('lightbox-img-b')}
function lbUpdate(i){
  document.getElementById('lightbox-name').textContent=cleanName(files[i].name);
  document.getElementById('lightbox-prev').style.visibility=i>0?'visible':'hidden';
  document.getElementById('lightbox-next').style.visibility=i<files.length-1?'visible':'hidden';
}
function resetSlots(){
  const a=imgA(),b=imgB();
  a.style.transition='none';a.style.transform='';a.style.opacity='1';
  b.style.transition='none';b.style.transform='';b.style.opacity='0';b.src='';
}
function openLightbox(i){
  lightboxIdx=i;resetSlots();imgA().src=files[i].url;lbUpdate(i);
  const lb=document.getElementById('lightbox');void lb.offsetWidth;lb.classList.add('open');
  document.body.style.overflow='hidden';
}
let _lbBusy=false;
function navLightbox(dir){
  if(_lbBusy)return;
  const next=lightboxIdx+dir;if(next<0||next>=files.length)return;
  _lbBusy=true;const a=imgA(),b=imgB();
  b.src=files[next].url;b.style.transition='none';b.style.transform='translateX(0)';b.style.opacity='0';void b.offsetWidth;
  a.style.transition='opacity .35s ease';a.style.opacity='0';
  setTimeout(function(){
    lightboxIdx=next;lbUpdate(next);resetSlots();imgA().src=files[next].url;
    imgA().style.transition='none';imgA().style.opacity='0';void imgA().offsetWidth;
    imgA().style.transition='opacity .35s ease';imgA().style.opacity='1';_lbBusy=false;
  },370);
}
function closeLightbox(e){
  if(e&&e.target!==e.currentTarget&&!e.target.classList.contains('lightbox-close'))return;
  const lb=document.getElementById('lightbox');lb.classList.remove('open');
  setTimeout(function(){
    imgA().src='';imgB().src='';resetSlots();document.body.style.overflow='';
  },230);
}
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lightbox').classList.contains('open'))return;
  if(e.key==='ArrowLeft')navLightbox(-1);
  if(e.key==='ArrowRight')navLightbox(1);
  if(e.key==='Escape')closeLightbox();
});
loadFiles();
</script>
</body>
</html>
